services:
  sub2api:
    image: sub2api-custom:${SUB2API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26.1-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.21}
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:18-alpine}
        VERSION: ${SUB2API_BUILD_VERSION:-}
        COMMIT: ${SUB2API_BUILD_COMMIT:-custom}
        DATE: ${SUB2API_BUILD_DATE:-}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_VERSION: ${PNPM_VERSION:-9}
